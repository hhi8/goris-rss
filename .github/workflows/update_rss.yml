name: Daily RSS Updater

on:
  schedule:
    - cron: '0 0 * * *' # 每天台灣時間早上 8 點執行
  workflow_dispatch: # 允許手動點擊執行按鈕

# 允許機器人把產生的 rss.xml 存回你的專案
permissions:
  contents: write 

jobs:
  build:
    runs-on: ubuntu-latest # (已修正這裡的語法)

    steps:
    - name: 取得專案程式碼
      uses: actions/checkout@v4

    - name: 設定 Python 環境
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: 安裝 Python 套件
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: 安裝 Playwright 瀏覽器
      run: |
        playwright install chromium

    - name: 執行 Python 爬蟲腳本
      run: |
        python scraper.py

    - name: 將 rss.xml 儲存並推送到 GitHub
      uses: stefanzweifel/git-auto-commit-action@v5
      with:
        commit_message: "自動更新 RSS (GitHub Actions)"
        file_pattern: 'rss.xml'
